default_language = "fr"
base_url = "https://bdcbqa314159.github.io/myBureau"
title = "myBureau"
compile_sass = false
build_search_index = false

[extra]
# ---------------------------------------------------------------
# NOT LIVE YET.
#
# While `live = false` this deployment is a demo of the ENGINE. It
# carries no client's name and tells search engines to stay away,
# so placeholder content is harmless — nobody's portfolio is being
# misrepresented, because nobody is named.
#
# Flip to true only when the real name and the real assets are both
# in. See "Going live" in the README.
# ---------------------------------------------------------------
live = false

author = "Bernardo Cohen"
author_url = "https://github.com/bdcbqa314159"
studio = "deLapatadaSoftware"

image_types = ["jpg", "jpeg", "png", "webp", "avif", "gif"]

# A project folder containing one of these opens as a window on the
# bureau instead of navigating to a page: the film beside the text that
# explains it. Drop a video in, and that is what it becomes.
video_types = ["mp4", "webm", "mov", "m4v"]

# Top-level bureaus come from the filesystem. Only things that are not
# places belong here. `key` names a string in [translations]; `name`
# instead of `key` puts the same word in every language.
nav_extra = [
  { key = "nav_contact", url = "#contact" },
]

# Bottom centre of every page. One line per place she is — drop the line
# and the icon goes with it.
#
# TWO files per service, and neither of them ours. The marks are the
# owners' trademarks, taken unmodified from each owner's own brand kit,
# and NONE of the three allows you to recolour their mark yourself — so
# where a white one is needed on a photograph and a black one on a cream
# project page, both come from the kit. See static/img/brand/SOURCES.md.
#
# `url` must point at HER OWN profile before this goes live: all three
# permit the mark as a link to your own presence, and none of them
# permit it as decoration pointing at their homepage. The urls below are
# placeholders, like the photographs.
social = [
  { name = "instagram", url = "https://instagram.com/",
    on_photo = "img/brand/instagram-white.svg", on_paper = "img/brand/instagram-black.svg" },
  { name = "youtube",   url = "https://youtube.com/",
    on_photo = "img/brand/youtube-white.png",   on_paper = "img/brand/youtube-black.png" },
  { name = "spotify",   url = "https://spotify.com/",
    on_photo = "img/brand/spotify-white.png",   on_paper = "img/brand/spotify-black.png" },
]

# The strings the browser needs, written into each page as JSON for the
# language being rendered. Everything else is resolved while building.
browser_strings = [
  "window_min", "window_max", "form_sending", "form_sent", "form_failed",
  "form_offline", "err_mail_missing", "err_mail_long", "err_mail_invalid",
  "err_mail_one", "err_mail_shape", "err_subject_long", "err_subject_bad",
  "err_subject_inv", "err_msg_missing", "err_msg_long", "err_msg_bad",
  "err_msg_inv", "err_msg_links",
]

# ---- whose site this is. `live` picks one. ----
[extra.demo]
owner  = "a demo of"
studio = "myBureau"
title  = "myBureau — desktop-metaphor site engine"

[extra.real]
owner  = "valentina for"
studio = "STUDIO S"
title  = "valentina for STUDIO S"

# ---- contact form ----------------------------------------------------
# One endpoint for everybody on the service — the access key is the only
# thing that says where a submission goes.
#
# Two keys, picked by `live`, for the same reason the name and the robots
# policy are: on launch day the destination must change WITH the identity.
# A single key would mean flipping live = true puts her name up while her
# enquiries still arrive in Bernardo's inbox, silently, until a client
# says they never heard back.
#
# Empty key = the form says it is not connected rather than swallowing
# the message. The key is public by design; it lives in the page HTML so
# the browser can submit. It is a destination, not a secret.
#
# Everything the browser checks is a courtesy — an attacker POSTs straight
# at the endpoint. Verify the backend with tools/injection-probe.sh.
[extra.contact]
endpoint = "https://api.web3forms.com/submit"

[extra.contact.demo]
# Bernardo's test key. Receives while live = false.
access_key = "fe39bfbb-f3bb-462f-ba55-136c9535b226"

[extra.contact.real]
# STUDIO S. Receives once live = true. Registered by her, to her address.
access_key = ""

# ======================================================================
# LANGUAGES
# ----------------------------------------------------------------------
# Adding one is a block like the English one below, and nothing else.
# No template is edited, no code changes, no build step is added. The
# switcher, the lang attribute, the hreflang links and the fallback
# chain all read this list.
#
# Then:   python3 tools/i18n.py --check     what is still untranslated
#         python3 tools/i18n.py --sync      create the missing files
#
# Anything not translated falls back to the default language rather than
# breaking, because a site is half-translated for a while and that has
# to look deliberate.
# ======================================================================

