<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myBureau — panneau</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <strong>myBureau</strong>
  <span class="lamp" id="lamp"></span>
  <span class="says" id="says">…</span>
  <button id="verify">Vérifier</button>
  <button id="undo">Annuler</button>
  <button id="open">Ouvrir dans un onglet</button>
</header>

<main class="frame">
  <div class="side">
    <nav class="tree" id="tree" aria-label="le contenu"></nav>
    <div class="make">
      <!-- NO ROW OF SELECTS. It was `dans …`, `quoi créer`, a name and
           a button — four controls to say two things, and she could
           pick a film and `dans: pellicules`, press Créer and be told
           no.

           She right-clicks the surface instead. Pointing says WHERE,
           so the menu can offer only what belongs there and the
           refusal becomes unreachable rather than explained. And the
           click has an x and a y, so the thing lands under the pointer
           instead of in a slot she has to drag it out of.

           See whatFitsIn() and openMenu() in app.js. -->
      <p class="willbe" id="makehint">Clic droit sur le bureau pour créer.</p>
      <!-- A browser cannot browse her disk, and no panel will change
           that. It CAN take a whole folder in one gesture, which is the
           thing she actually wants: no second window to arrange beside
           this one, no dragging between them. -->
      <button id="adddir">Ajouter un dossier…</button>
      <input type="file" id="pickdir" webkitdirectory directory multiple
             hidden aria-hidden="true" tabindex="-1">
      <!-- what the folder picker will do, and where. It used to read
           the row's `dans`; with the row gone it goes into whatever is
           CHOSEN, which the panel always has and which she can see. -->
      <p class="willbe" id="willbe"></p>
    </div>
  </div>

  <section class="stage">
    <!-- the real site, served from this address so the panel can reach
         into it. Not a drawing of the site: the site. -->
    <iframe id="view" title="le site" src="/site/"></iframe>
    <p class="tip">
      <span id="tip">Attrape une icône dans la page et pose-la.</span>
      <span class="toggle">
        <button id="asdesk" aria-pressed="true">sur le bureau</button><button
                id="aspage" aria-pressed="false">regarder</button>
      </span>
      <!-- An iframe has its own viewport, so narrowing this one makes
           the SITE'S OWN phone rules fire inside it. Not a drawing of
           the phone, and not a simulation: the page, at that width. -->
      <span class="toggle">
        <button id="aswide" aria-pressed="true">écran</button><button
                id="asphone" aria-pressed="false">téléphone</button>
      </span>
    </p>
  </section>

  <aside class="look" id="look" aria-label="détails"></aside>
</main>

<pre class="health" id="health" hidden></pre>
<script src="/app.js"></script>
</body>
</html>
