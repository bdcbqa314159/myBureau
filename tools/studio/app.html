<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myBureau — panneau</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <strong>myBureau</strong>
  <span class="lamp" id="lamp"></span>
  <span class="says" id="says">…</span>
  <button id="verify">Vérifier</button>
  <button id="undo">Annuler</button>
  <button id="open">Ouvrir dans un onglet</button>
</header>

<main class="frame">
  <div class="side">
    <nav class="tree" id="tree" aria-label="le contenu"></nav>
    <div class="make">
      <label class="where">dans
        <select id="into" aria-label="dans quel dossier"></select>
      </label>
      <select id="kind" aria-label="quoi créer">
        <option value="photos">des photos</option>
        <option value="film">un film</option>
        <option value="document">un document (pages en images)</option>
        <option value="page">une page</option>
        <option value="bureau">un dossier</option>
      </select>
      <input type="text" id="newname" placeholder="nom" aria-label="nom">
      <button id="make">Créer</button>
      <!-- what it will do THERE. A folder's job depends on where it is,
           so the destination is not a detail to be inferred. -->
      <p class="willbe" id="willbe"></p>
    </div>
  </div>

  <section class="stage">
    <!-- the real site, served from this address so the panel can reach
         into it. Not a drawing of the site: the site. -->
    <iframe id="view" title="le site" src="/site/"></iframe>
    <p class="tip">
      <span id="tip">Attrape une icône dans la page et pose-la.</span>
      <span class="toggle">
        <button id="asdesk" aria-pressed="true">sur le bureau</button><button
                id="aspage" aria-pressed="false">regarder</button>
      </span>
    </p>
  </section>

  <aside class="look" id="look" aria-label="détails"></aside>
</main>

<pre class="health" id="health" hidden></pre>
<script src="/app.js"></script>
</body>
</html>
